name: Screener Daily Auto-Sync

on:
  schedule:
    - cron: '30 2 * * *' # Runs daily at 2:30 AM UTC (8:00 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Daily Screener Sync & Search Indexer
        run: python sync_screener.py

      - name: Commit & Push Fresh Screener Data and Search Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_data.json search_index.json
          git commit -m "Auto-refresh screener metrics and search index $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]" || exit 0
          git push
