<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Lightweight Charts Library (HTML5 Canvas) -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
  
  <title>AlphaWatch • Screener & Dual TradingView Charts</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AlphaWatch">
  <meta name="theme-color" content="#070a12">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN for Portfolio Tab -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070a12;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .safe-top { padding-top: max(16px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.25s ease-in-out 0s 2; }
  </style>
</head>
<body class="min-h-screen safe-top safe-bottom flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- ==========================================
       IN-APP PIN / PASSCODE LOCK OVERLAY (Option A)
       ========================================== -->
  <div id="pin-lock-screen" class="fixed inset-0 z-[100] bg-[#070a12] flex flex-col items-center justify-center p-6 select-none">
    <div class="w-full max-w-xs flex flex-col items-center text-center">
      <!-- App Logo -->
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-2xl shadow-emerald-500/30 text-slate-950 font-black text-3xl mb-4">
        α
      </div>
      <h2 id="pin-title" class="text-xl font-bold text-white tracking-tight">Enter Passcode</h2>
      <p id="pin-subtitle" class="text-xs text-slate-400 mt-1">Default PIN is <span class="mono text-emerald-400 font-semibold">1100</span> (or set your own)</p>

      <!-- 4-Dot Indicator -->
      <div id="pin-dots" class="flex items-center justify-center gap-4 my-7">
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
        <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-slate-600 transition-all duration-150"></div>
      </div>

      <!-- Error / Status Message -->
      <div id="pin-error" class="h-5 text-xs font-semibold text-rose-400 mb-2"></div>

      <!-- iOS-Style Numeric Keypad -->
      <div class="grid grid-cols-3 gap-4 w-full max-w-[260px]">
        <button onclick="pressPin('1')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">1</button>
        <button onclick="pressPin('2')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">2</button>
        <button onclick="pressPin('3')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">3</button>
        <button onclick="pressPin('4')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">4</button>
        <button onclick="pressPin('5')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">5</button>
        <button onclick="pressPin('6')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">6</button>
        <button onclick="pressPin('7')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">7</button>
        <button onclick="pressPin('8')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">8</button>
        <button onclick="pressPin('9')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">9</button>
        <button onclick="clearPin()" class="h-16 rounded-2xl bg-slate-900/50 border border-slate-800 text-xs font-semibold text-slate-400 active:bg-slate-800 transition-all flex items-center justify-center">Clear</button>
        <button onclick="pressPin('0')" class="h-16 rounded-2xl glass-card text-xl font-bold text-white active:bg-emerald-500 active:text-slate-950 transition-all flex items-center justify-center">0</button>
        <button onclick="backspacePin()" class="h-16 rounded-2xl bg-slate-900/50 border border-slate-800 text-slate-300 active:bg-slate-800 transition-all flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
        </button>
      </div>

      <!-- Remember This iPhone Checkbox -->
      <label class="mt-6 flex items-center gap-2 text-xs text-slate-400 cursor-pointer">
        <input id="remember-device" type="checkbox" checked class="w-4 h-4 rounded accent-emerald-500">
        <span>Keep this iPhone unlocked permanently</span>
      </label>
    </div>
  </div>

  <!-- ==========================================
       MAIN DASHBOARD CONTENT (Unlocked State)
       ========================================== -->
  <div id="app-content" class="hidden flex-1 flex flex-col">
    <!-- Sticky Top Navigation -->
    <header class="sticky top-0 z-40 px-4 py-3 bg-[#070a12]/92 backdrop-blur-xl border-b border-slate-800/80">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-slate-950 font-black text-xl">
            α
          </div>
          <div>
            <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
              AlphaWatch
              <span id="badge-count" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">31 Stocks</span>
            </h1>
            <p id="last-updated" class="text-[11px] text-slate-400 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              Syncing live cloud feeds...
            </p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-1.5">
          <button onclick="openAddModal()" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-1 shadow-md shadow-emerald-500/20 active:scale-95 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            <span>Add</span>
          </button>

          <button onclick="fetchData(true)" title="Force Refresh" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 active:scale-95 transition-all">
            <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>

          <!-- Change PIN / Lock Button -->
          <button onclick="openPinSettings()" title="PIN & Lock Settings" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 active:scale-95 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          </button>
        </div>
      </div>

      <!-- Search Bar & Filters -->
      <div class="max-w-6xl mx-auto mt-3 space-y-2">
        <div class="relative">
          <input id="search-input" oninput="render()" type="text" placeholder="Search by ticker, company, note, or sector..." class="w-full px-4 py-2.5 pl-10 rounded-xl bg-slate-900/90 border border-slate-700/60 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-all">
          <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Filter Chips -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 text-xs font-medium">
          <button onclick="setFilter('ALL')" id="filter-ALL" class="filter-btn px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 font-bold whitespace-nowrap transition-all shadow-md shadow-emerald-500/20">All</button>
          <button onclick="setFilter('WAIT')" id="filter-WAIT" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700/60 whitespace-nowrap hover:bg-slate-700 transition-all">⏳ Wait / Review</button>
          <button onclick="setFilter('HIGH_ROCE')" id="filter-HIGH_ROCE" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700/60 whitespace-nowrap hover:bg-slate-700 transition-all">🔥 ROCE > 22%</button>
          <button onclick="setFilter('VALUE')" id="filter-VALUE" class="filter-btn px-3 py-1.5 rounded-lg
